name: CI

on:
  push:
    branches: [main, f0/fundacoes, f1/**, f2/**, f3/**, f4/**, f5/**]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

      - name: CLI smoke (SPEC §16 F0)
        run: uv run nutridb --help | grep -q "extract"

  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: explorer

      - name: Build (tsc + vite)
        run: npm run build
        working-directory: explorer